[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-task-coordinator"
version = "0.1.0"
description = "Local, recoverable multiproject task coordinator core"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
flow-coordinator = "flow_coordinator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
