version = 1

[[actions]]
id = "execute-task"
label = "Execute task"
backend = "gota-task"
mutable = true
requires_prompt = true
prompt_source = "clipboard"
requires_confirmation = true
confirmation_mode = "explicit"
agent = "gota-worker"
model = "openai/gpt-5.6-luna"
variant = "max"
template = "gota-worker-v1"
description = "Run a validated Gota Worker, Reviewer, and Coordinator decision cycle."

