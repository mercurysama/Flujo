name: PixNido panel lab validation

on:
  push:
    branches:
      - experiment/pixnido-servo-dock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-js:
    name: Bridge protocol and whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript bridge protocol
        run: node tests/editor/pixnido_export_bridge.test.cjs
      - name: Native color and palette adapter
        run: node tests/editor/nidolab_native_dialogs.test.cjs
      - name: Changed-file whitespace check
        run: git diff --check HEAD~1 HEAD

  godot-headless:
    name: Godot 4.7.2 project and sprite writer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.7.2 Linux build
        shell: bash
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          chmod +x "$RUNNER_TEMP/godot-bin/Godot_v4.7.2-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"
          mv "$RUNNER_TEMP/godot-bin/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot-bin/godot"
      - name: Check Godot version
        run: godot --version | grep "4.7.2"
      - name: Baseline without experimental PixNido dock
        shell: bash
        run: |
          set -o pipefail
          cp project.godot "$RUNNER_TEMP/project-original.godot"
          trap 'cp "$RUNNER_TEMP/project-original.godot" project.godot' EXIT
          sed -i 's/, "res:\/\/addons\/pixnido_panel_lab\/plugin.cfg"//' project.godot
          godot --headless --editor --path . --quit-after 5 2>&1 | tee godot-baseline.log
      - name: Import project with PixNido lab and parse plugins
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --quit-after 5 2>&1 | tee godot-import.log
      - name: Compare editor startup errors against baseline
        shell: bash
        run: |
          grep 'ERROR:' godot-baseline.log | sort -u > baseline-errors.txt || true
          grep 'ERROR:' godot-import.log | sort -u > pixnido-errors.txt || true
          comm -23 pixnido-errors.txt baseline-errors.txt > new-editor-errors.txt
          if [[ -s new-editor-errors.txt ]]; then
            cat new-editor-errors.txt
            echo "::error::New editor errors introduced by experimental panel"
            exit 1
          fi
          if [[ -s pixnido-errors.txt ]]; then
            echo "::warning::Editor logged errors also present without experimental PixNido dock"
          fi
      - name: Test sprite writer
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/editor/pixnido_export_writer_smoke.gd 2>&1 | tee pixnido-writer.log
      - name: NidoLab focus overlay behavior
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/editor/nidolab_focus_smoke.gd 2>&1 | tee nidolab-focus.log
          grep -F "[NidoLab] Focus workspace smoke test passed" nidolab-focus.log
      - name: NidoLab three-tab references and persistence
        shell: bash
        run: |
          set -o pipefail
          timeout 35s godot --headless --path . --script res://tests/editor/nidolab_reference_tabs_smoke.gd 2>&1 | tee nidolab-tabs.log
          grep -F "[NidoLab] References tabs smoke test passed" nidolab-tabs.log
          if grep -E '(SCRIPT ERROR:|ERROR:)' nidolab-tabs.log; then
            echo "::error::NidoLab reference tabs emitted a Godot error"
            exit 1
          fi
      - name: Future-ready NidoLab editor tabs
        shell: bash
        run: |
          set -o pipefail
          timeout 35s godot --headless --editor --path . --script res://tests/editor/nidolab_editor_tabs_smoke.gd 2>&1 | tee nidolab-editor-tabs.log
          grep -F "[NidoLab] Editor tabs smoke test passed" nidolab-editor-tabs.log
          if grep -E '(SCRIPT ERROR:|ERROR:)' nidolab-editor-tabs.log; then
            echo "::error::NidoLab editor-tabs test emitted a Godot error"
            exit 1
          fi
      - name: Regression model smoke
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . tests/model/flow_model_smoke_test.tscn 2>&1 | tee flujo-smoke.log
          grep -F "[Flujo] Model smoke test passed" flujo-smoke.log
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixnido-lab-validation-logs
          path: |
            godot-baseline.log
            godot-import.log
            baseline-errors.txt
            pixnido-errors.txt
            new-editor-errors.txt
            pixnido-writer.log
            nidolab-focus.log
            nidolab-tabs.log
            nidolab-editor-tabs.log
            flujo-smoke.log
          if-no-files-found: ignore
