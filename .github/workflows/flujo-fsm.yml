name: Flujo FSM — remote baseline and regression
on:
  push:
    branches:
      - feature/fsm-runtime-flow-flusso
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Git whitespace gate (latest committed diff)
        shell: bash
        run: |
          git diff --check
          git diff --check HEAD^ HEAD
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -o godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          ./Godot_v4.7.2-stable_linux.x86_64 --version | tee godot_version.txt
          grep -q '^4\.7\.2' godot_version.txt
      - name: Editor load
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit-after 5
      - name: Behavior catalog validator
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/governance/behavior_catalog_validator_test.gd
      - name: Diagnose complex editor parser
        continue-on-error: true
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --check-only --script addons/vp_flujo/editor/flow_complex_value_editor.gd
      - name: Model baseline
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/model/flow_model_smoke_test.tscn
      - name: Ready baseline
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_ready_runtime_test.tscn
      - name: Navigation baseline
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_navigation_runtime_test.tscn
      - name: Potok-9B3B2 early save I/O preflight failure focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 70s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_snapshot_save_preflight_failure_test.tscn
      - name: Potok-9B2A user snapshot write and restore path matrix focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 70s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_snapshot_path_matrix_test.tscn
