name: Flujo FSM — remote baseline and regression
on:
  push:
    branches:
      - feature/fsm-runtime-flow-flusso
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Git whitespace gate (latest committed diff)
        shell: bash
        run: |
          git diff --check
          git diff --check HEAD^ HEAD
      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -o godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          ./Godot_v4.7.2-stable_linux.x86_64 --version | tee godot_version.txt
          grep -q '^4\.7\.2' godot_version.txt
      - name: Editor load
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --quit-after 5
      - name: Behavior catalog validator
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/governance/behavior_catalog_validator_test.gd
      - name: Diagnose complex editor parser
        continue-on-error: true
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --check-only --script addons/vp_flujo/editor/flow_complex_value_editor.gd
      - name: Model baseline
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/model/flow_model_smoke_test.tscn
      - name: Ready baseline
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_ready_runtime_test.tscn
      - name: Navigation baseline
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_navigation_runtime_test.tscn
      - name: FSM snapshot focal (when present)
        shell: bash
        run: |
          if test -f tests/runtime/flow_fsm_snapshot_test.tscn; then
            timeout --signal=TERM --kill-after=5s 40s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_snapshot_test.tscn
          else
            echo 'FSM snapshot test missing; not a PASS'
          fi
      - name: FSM dynamic state focal (when present)
        shell: bash
        run: |
          if test -f tests/runtime/flow_fsm_dynamic_test.tscn; then
            ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_dynamic_test.tscn
          else
            echo 'FSM dynamic test missing; not a PASS'
          fi
      - name: Potok-7E1D repeated scene and instance isolation focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 80s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/model/flow_fsm_double_roundtrip_instance_isolation_test.gd
      - name: Potok-7E1C typed Condition Tok scene persistence focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 80s ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --script tests/editor/flow_fsm_condition_tok_scene_roundtrip_test.gd
      - name: Potok-7E1B2 structural UndoRedo scene roundtrip focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 80s ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --script tests/editor/flow_fsm_structural_scene_roundtrip_test.gd
      - name: Potok-7E1B1 edited scene UndoRedo persistence focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 70s ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --script tests/editor/flow_fsm_edited_scene_roundtrip_test.gd
      - name: Potok-7E1A authored scene persistence focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 45s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/model/flow_fsm_authored_scene_roundtrip_test.gd
      - name: Potok-7D2 Event field Condition Tok authoring focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 80s ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --script tests/editor/flow_fsm_event_payload_tok_test.gd
      - name: Potok-7D2 typed event field Condition runtime focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 35s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_event_payload_condition_test.tscn
      - name: Potok-7D1 Condition Tok in Flusso editor focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 80s ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --script tests/editor/flow_fsm_condition_tok_bridge_test.gd
      - name: Potok-7C2B structural Fluo deletion and Cancel focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 80s ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --script tests/editor/flow_fsm_structural_fluo_test.gd
      - name: Potok-7C2B structural state and transition commands focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 80s ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --script tests/editor/flow_fsm_structural_commands_test.gd
      - name: Potok-7C2A transition metadata and Flusso focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 75s ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --script tests/editor/flow_fsm_transition_metadata_test.gd
      - name: Potok-7C1 Flusso scalar and undo redo focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 75s ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --script tests/editor/flow_fsm_flusso_scalar_test.gd
      - name: Potok-7B Inspector to Fluo state navigation focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 70s ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --script tests/editor/flow_fsm_fluo_navigation_test.gd
      - name: Potok-7A read-only FSM editor projection focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 30s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/editor/flow_fsm_editor_projection_test.tscn
      - name: Potok-6H1 negative routing and scene order focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 30s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_negative_routing_test.tscn
      - name: Potok-6H2 reentrant shutdown focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 30s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_reentrant_stop_test.tscn
      - name: Potok-6G per-machine tick work budget focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 30s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_tick_work_budget_test.tscn
      - name: Potok-6F-1 direct metadata focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 30s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_direct_request_metadata_test.tscn
      - name: Potok-6D event lineage isolation focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 30s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_event_lineage_isolation_test.tscn
      - name: Potok-6C-2 chain budget focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 30s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_chain_budget_test.tscn
      - name: Potok-6C-1 bounded cycle focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 30s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_bounded_cycle_test.tscn
      - name: Potok-6B cross-machine lifecycle focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 30s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_cross_machine_lifecycle_test.tscn
      - name: Potok-6A cross-machine request focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 30s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_cross_machine_request_test.tscn
      - name: Potok-5G admission diagnostic focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 30s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_admission_diagnostics_test.tscn
      - name: Potok-5F-2 event consumption focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 30s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_event_consumption_test.tscn
      - name: Potok-5F-1 typed event envelope focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 30s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_event_envelope_test.tscn
      - name: FSM-5E self-event arbitration focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 30s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_self_event_test.tscn
      - name: FSM-5D multi-event arbitration focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 30s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_multi_event_arbitration_test.tscn
      - name: FSM-5C cross-clock capacity focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 30s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_queue_capacity_test.tscn
      - name: FSM-5B conditions and self-transition focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 30s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_conditions_test.tscn
      - name: FSM-5A event ordering focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 30s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_event_order_test.tscn
      - name: FSM transition focal (when present)
        shell: bash
        run: |
          if test -f tests/runtime/flow_fsm_transitions_test.tscn; then
            ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_transitions_test.tscn
          else
            echo 'FSM transition test not authored yet; not counted as PASS'
          fi
      - name: FSM engine clocks and pause focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 30s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_engine_clocks_test.tscn
      - name: FSM lifecycle edge focal
        shell: bash
        run: timeout --signal=TERM --kill-after=5s 30s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_lifecycle_edge_test.tscn
      - name: FSM runtime focal (when present)
        shell: bash
        run: |
          if test -f tests/runtime/flow_fsm_runtime_test.tscn; then
            ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . tests/runtime/flow_fsm_runtime_test.tscn
          else
            echo 'FSM test not authored yet; not counted as PASS'
          fi
